<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Count the pixels on each side as seen from the front, and note the start corner and direction</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e5e7eb"/></marker>
  </defs>
  <rect width="900" height="620" rx="16" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="700" fill="#111827">Seen from the FRONT of the TV</text>

  <!-- top label -->
  <rect x="335" y="52" width="150" height="46" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="410" y="72" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">Top: 12</text>
  <text x="410" y="90" font-size="12" fill="#4b5563" text-anchor="middle">red while calibrating</text>

  <g transform="translate(0,60)">
    <!-- TV -->
    <rect x="160" y="74" width="500" height="290" rx="10" fill="#111827"/>
    <rect x="172" y="86" width="476" height="266" rx="4" fill="#374151"/>
    <text x="410" y="222" font-size="16" fill="#d1d5db" text-anchor="middle">screen</text>
    <text x="410" y="244" font-size="13" fill="#9ca3af" text-anchor="middle">the strip is glued behind it, along the edges</text>
    <path d="M370 364 L350 392 H470 L450 364" fill="#111827"/>

    <!-- direction arrows inside the screen: clockwise from bottom-left -->
    <path d="M196 330 V120" stroke="#e5e7eb" stroke-width="3" marker-end="url(#arr)"/>
    <path d="M214 108 H600" stroke="#e5e7eb" stroke-width="3" marker-end="url(#arr)"/>
    <text x="214" y="290" font-size="13" fill="#e5e7eb">direction:</text>
    <text x="214" y="308" font-size="13" fill="#e5e7eb">clockwise here</text>

    <!-- top: red, 12 -->
    <g fill="#ef4444">
      <circle cx="190" cy="58" r="7"/><circle cx="230" cy="58" r="7"/><circle cx="270" cy="58" r="7"/><circle cx="310" cy="58" r="7"/>
      <circle cx="350" cy="58" r="7"/><circle cx="390" cy="58" r="7"/><circle cx="430" cy="58" r="7"/><circle cx="470" cy="58" r="7"/>
      <circle cx="510" cy="58" r="7"/><circle cx="550" cy="58" r="7"/><circle cx="590" cy="58" r="7"/><circle cx="630" cy="58" r="7"/>
    </g>
    <!-- right: green, 7 -->
    <g fill="#22c55e">
      <circle cx="678" cy="100" r="7"/><circle cx="678" cy="138" r="7"/><circle cx="678" cy="176" r="7"/><circle cx="678" cy="214" r="7"/>
      <circle cx="678" cy="252" r="7"/><circle cx="678" cy="290" r="7"/><circle cx="678" cy="328" r="7"/>
    </g>
    <!-- bottom: yellow, 12 -->
    <g fill="#eab308">
      <circle cx="190" cy="380" r="7"/><circle cx="230" cy="380" r="7"/><circle cx="270" cy="380" r="7"/><circle cx="310" cy="380" r="7"/>
      <circle cx="350" cy="380" r="7"/><circle cx="390" cy="380" r="7"/><circle cx="430" cy="380" r="7"/><circle cx="470" cy="380" r="7"/>
      <circle cx="510" cy="380" r="7"/><circle cx="550" cy="380" r="7"/><circle cx="590" cy="380" r="7"/><circle cx="630" cy="380" r="7"/>
    </g>
    <!-- left: blue, 7; LED 1 (white) at the bottom -->
    <g fill="#3b82f6">
      <circle cx="142" cy="100" r="7"/><circle cx="142" cy="138" r="7"/><circle cx="142" cy="176" r="7"/><circle cx="142" cy="214" r="7"/>
      <circle cx="142" cy="252" r="7"/><circle cx="142" cy="290" r="7"/>
    </g>
    <circle cx="142" cy="328" r="8" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>

    <!-- right label -->
    <rect x="700" y="190" width="160" height="48" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="780" y="211" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle">Right: 7</text>
    <text x="780" y="229" font-size="12" fill="#4b5563" text-anchor="middle">green while calibrating</text>

    <!-- left label -->
    <rect x="10" y="190" width="116" height="48" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="68" y="211" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">Left: 7</text>
    <text x="68" y="229" font-size="12" fill="#4b5563" text-anchor="middle">blue</text>

    <!-- bottom label -->
    <rect x="500" y="400" width="170" height="48" rx="10" fill="#fefce8" stroke="#fde047"/>
    <text x="585" y="421" font-size="15" font-weight="700" fill="#a16207" text-anchor="middle">Bottom: 12</text>
    <text x="585" y="439" font-size="12" fill="#4b5563" text-anchor="middle">yellow while calibrating</text>

    <!-- LED 1 callout -->
    <path d="M136 338 L110 400" stroke="#111827" stroke-width="1.5"/>
    <rect x="10" y="400" width="250" height="48" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="135" y="421" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">LED 1 (white) = start corner</text>
    <text x="135" y="439" font-size="12" fill="#4b5563" text-anchor="middle">where the wire from the ESP32 enters</text>
  </g>

  <!-- instructions -->
  <rect x="24" y="522" width="852" height="88" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="44" y="550" font-size="15" fill="#111827"><tspan font-weight="700">Write down 3 things:</tspan> the pixels on each side, the corner where the strip starts, and the direction.</text>
  <text x="44" y="574" font-size="15" fill="#111827"><tspan font-weight="700" fill="#c2410c">Careful:</tspan> you glue the strip from BEHIND, where left and right are swapped.</text>
  <text x="44" y="598" font-size="15" fill="#111827">The app always asks about the sides as seen from the front, where you sit.</text>
</svg>
