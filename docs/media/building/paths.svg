<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Two ways to build it: your own ESP32 kit, or HyperHDR with lights you already have</title>
  <defs>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <g id="tv">
      <rect x="-26" y="-18" width="52" height="32" rx="3" fill="#1f2937"/>
      <rect x="-22" y="-14" width="44" height="24" rx="1" fill="#60a5fa"/>
      <path d="M-10 20 H10 M0 14 V20" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="chip">
      <rect x="-16" y="-16" width="32" height="32" rx="4" fill="#1f2937"/>
      <path d="M-22 -8 H-16 M-22 0 H-16 M-22 8 H-16 M16 -8 H22 M16 0 H22 M16 8 H22 M-8 -22 V-16 M0 -22 V-16 M8 -22 V-16 M-8 16 V22 M0 16 V22 M8 16 V22" stroke="#1f2937" stroke-width="2.5"/>
      <rect x="-8" y="-8" width="16" height="16" rx="2" fill="#9ca3af"/>
    </g>
    <g id="strip">
      <rect x="-34" y="-9" width="68" height="18" rx="4" fill="#f3f4f6" stroke="#9ca3af"/>
      <circle cx="-22" cy="0" r="5" fill="#ef4444"/><circle cx="-7" cy="0" r="5" fill="#22c55e"/>
      <circle cx="8" cy="0" r="5" fill="#3b82f6"/><circle cx="23" cy="0" r="5" fill="#eab308"/>
    </g>
    <g id="server">
      <rect x="-22" y="-20" width="44" height="17" rx="3" fill="#1f2937"/>
      <rect x="-22" y="1" width="44" height="17" rx="3" fill="#1f2937"/>
      <circle cx="-13" cy="-11.5" r="2.5" fill="#22c55e"/><circle cx="-13" cy="9.5" r="2.5" fill="#22c55e"/>
      <path d="M0 -11.5 H14 M0 9.5 H14" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g id="bulbs">
      <circle cx="-14" cy="-4" r="11" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
      <rect x="-19" y="7" width="10" height="7" rx="1.5" fill="#6b7280"/>
      <circle cx="14" cy="-4" r="11" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2"/>
      <rect x="9" y="7" width="10" height="7" rx="1.5" fill="#6b7280"/>
    </g>
  </defs>

  <rect width="900" height="420" rx="16" fill="#ffffff"/>

  <!-- Path A -->
  <rect x="12" y="12" width="876" height="190" rx="14" fill="#eff6ff"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#1d4ed8">A · Build the kit</text>
  <text x="200" y="44" font-size="15" fill="#374151">you solder a small controller; the strip goes behind the TV</text>

  <rect x="32" y="62" width="230" height="96" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <use href="#tv" x="147" y="88"/>
  <text x="147" y="132" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Samsung TV</text>
  <text x="147" y="150" font-size="13" fill="#4b5563" text-anchor="middle">+ the Ambilight app</text>

  <rect x="335" y="62" width="230" height="96" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <use href="#chip" x="450" y="90"/>
  <text x="450" y="132" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">ESP32 controller</text>
  <text x="450" y="150" font-size="13" fill="#4b5563" text-anchor="middle">this project's firmware</text>

  <rect x="638" y="62" width="230" height="96" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <use href="#strip" x="753" y="90"/>
  <text x="753" y="132" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">LED strip</text>
  <text x="753" y="150" font-size="13" fill="#4b5563" text-anchor="middle">12 V WS2811</text>

  <path d="M264 110 H331" stroke="#2563eb" stroke-width="3" marker-end="url(#arrA)"/>
  <text x="298" y="100" font-size="13" fill="#1d4ed8" text-anchor="middle">Wi-Fi</text>
  <path d="M567 110 H634" stroke="#2563eb" stroke-width="3" marker-end="url(#arrA)"/>
  <text x="601" y="100" font-size="13" fill="#1d4ed8" text-anchor="middle">3 wires</text>

  <text x="32" y="186" font-size="14" fill="#374151"><tspan font-weight="700">You need:</tspan> ESP32, 12 V WS2811 strip, 12 V power supply, a few small parts, a soldering iron.</text>

  <!-- Path B -->
  <rect x="12" y="216" width="876" height="190" rx="14" fill="#f5f3ff"/>
  <text x="32" y="248" font-size="20" font-weight="700" fill="#6d28d9">B · Use HyperHDR</text>
  <text x="212" y="248" font-size="15" fill="#374151">you already have lights (WLED, Hue…) and a HyperHDR server</text>

  <rect x="32" y="266" width="230" height="96" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <use href="#tv" x="147" y="292"/>
  <text x="147" y="336" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Samsung TV</text>
  <text x="147" y="354" font-size="13" fill="#4b5563" text-anchor="middle">+ the Ambilight app</text>

  <rect x="335" y="266" width="230" height="96" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <use href="#server" x="450" y="294"/>
  <text x="450" y="336" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">HyperHDR</text>
  <text x="450" y="354" font-size="13" fill="#4b5563" text-anchor="middle">Raspberry Pi, PC or NAS</text>

  <rect x="638" y="266" width="230" height="96" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <use href="#bulbs" x="753" y="292"/>
  <text x="753" y="336" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Your lights</text>
  <text x="753" y="354" font-size="13" fill="#4b5563" text-anchor="middle">WLED · Hue · Hyperk · Adalight</text>

  <path d="M264 314 H331" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrB)"/>
  <text x="298" y="304" font-size="13" fill="#6d28d9" text-anchor="middle">Wi-Fi</text>
  <path d="M567 314 H634" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrB)"/>
  <text x="601" y="304" font-size="13" fill="#6d28d9" text-anchor="middle">as usual</text>

  <text x="32" y="390" font-size="14" fill="#374151"><tspan font-weight="700">You need:</tspan> a running HyperHDR and lights it already drives. No soldering.</text>
</svg>
