name: TV package

# Builds the TV hybrid package (launcher + service) with tv/scripts/make_package.sh.
#  - build.yml calls it on every PR and push to main: the package is a workflow artifact.
#  - release.yml calls it with a tag: the package is also attached to that release, where
#    Apps2Samsung finds it (packaging/apps2samsung/).
# The package is signed with a throwaway certificate and must be re-signed for each TV.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach the package to; empty = artifact only
        type: string
        default: ''

jobs:
  package:
    name: Hybrid .wgt
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TIZEN_SDK: ${{ github.workspace }}/../tizen-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The service targets net6.0-tizen9.0 like the VS Code project, which needs Samsung's
      # Tizen workload.
      - name: Install the Tizen .NET workload
        run: |
          curl -fsSL -o "$RUNNER_TEMP/workload-install.sh" \
            https://raw.githubusercontent.com/Samsung/Tizen.NET/main/workload/scripts/workload-install.sh
          sudo bash "$RUNNER_TEMP/workload-install.sh" -d "$DOTNET_ROOT"
          dotnet workload list

      # Tizen-Core CLI (tz), the packager the VS Code Tizen extension uses, from the official
      # Tizen SDK package repository (versions and SHA256 from its pkg_list_ubuntu-64).
      - name: Install Tizen-Core CLI
        run: |
          base=https://download.tizen.org/sdk/tizenstudio/official/binary
          mkdir -p "$TIZEN_SDK"
          while read -r file sha; do
            curl -fsSL -o "$RUNNER_TEMP/$file" "$base/$file"
            echo "$sha  $RUNNER_TEMP/$file" | sha256sum -c -
            unzip -q -o "$RUNNER_TEMP/$file" 'data/*' -d "$RUNNER_TEMP/pkg"
          done <<'EOF'
          tizen-core_10.0.18_ubuntu-64.zip 08b60e8f630fe0c3aafa5be9251a75d9ce173f2521375ddb803f9a3cb57f62ec
          web-privilege-checker_0.0.2_ubuntu-64.zip 5dce06d92b3f046303f3baabd1e8a4bb6cfb7724e051da5d83205fd6d88f7ccc
          EOF
          cp -R "$RUNNER_TEMP/pkg/data/." "$TIZEN_SDK/"
          chmod +x "$TIZEN_SDK"/tools/tizen-core/{tz,tgn,ninja,web-privilege-checker}
          "$TIZEN_SDK/tools/tizen-core/tz" --version

      - name: Install expect
        timeout-minutes: 8
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get -o DPkg::Lock::Timeout=120 install -y -qq --no-install-recommends expect \
            || { sudo apt-get -o DPkg::Lock::Timeout=120 update -qq && sudo apt-get install -y -qq --no-install-recommends expect; }

      - name: Build the package
        run: tv/scripts/make_package.sh tv/release

      - uses: actions/upload-artifact@v4
        with:
          name: tv-package
          path: tv/release/

      - name: Attach to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" tv/release/*.wgt tv/release/SHA256SUMS-tv.txt --clobber
