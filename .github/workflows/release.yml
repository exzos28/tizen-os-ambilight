name: Release

# Push a tag like v1.2.0 to build the firmware and publish it as a GitHub release.
# The TV apps are not attached: they must be signed with a certificate for each TV.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: esp32/web/package-lock.json

      - name: Install web UI dependencies
        run: npm ci
        working-directory: esp32/web

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware and flashable images
        run: scripts/make_release.sh release
        working-directory: esp32

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --generate-notes \
            esp32/release/ambilight-esp32-factory.bin \
            esp32/release/ambilight-esp32-app.bin \
            esp32/release/SHA256SUMS.txt
