name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    name: ESP32 firmware + web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: esp32/web/package-lock.json

      - name: Install web UI dependencies
        run: npm ci
        working-directory: esp32/web

      - name: Type-check web UI
        run: npm run type-check
        working-directory: esp32/web

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('esp32/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run
        working-directory: esp32

  tools:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile tools/*.py
