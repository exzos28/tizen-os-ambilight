; Default environment flashes over USB:   pio run -t upload
; After the first flash, update over Wi-Fi: pio run -e ota -t upload

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform  = espressif32@6.13.0
board     = esp32dev
framework = arduino

; Two 1.875 MB OTA app slots instead of the default 1.25 MB. The NVS partition
; keeps its offset and size, so saved settings survive the switch. A partition
; table change only takes effect after a USB flash.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200

; Exact versions: a floating range pulled FastLED 3.10.8, whose ESP32 RMT driver silently
; stays off with this core (Arduino 2.0.17 / ESP-IDF 4.4, FastLED#4876) — the strip got no data.
lib_deps =
    fastled/FastLED@3.10.3
    bblanchon/ArduinoJson@7.4.3

extra_scripts =
    pre:scripts/version.py
    pre:scripts/embed_web.py

; upload_port = /dev/cu.usbserial-0001   ; set if auto-detection picks the wrong port

[env:ota]
extends         = env:esp32dev
upload_protocol = espota
upload_port     = ambilight.local   ; mDNS name = OTA hostname from the web UI; or the device IP
upload_flags    =
    --auth=123456                   ; OTA password from the web UI
    --timeout=60

; Host-side unit tests for code without Arduino dependencies (src/StripLayout.h):
;   pio test -e native
[env:native]
platform        = native
test_framework  = unity
build_flags     = -std=gnu++17 -I src
